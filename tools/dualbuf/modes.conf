# name | extra llama-completion args   (@NGL@ = half of the layers, set by NGL env, default 14)
# Add a new mode (e.g. the dual-buffer one) as one more line.
repack          | -ngl @NGL@ --no-host
host            | -ngl @NGL@
host_noopoff    | -ngl @NGL@ --no-op-offload
repack_noopoff  | -ngl @NGL@ --no-host --no-op-offload
cpu_only        | -dev none -ngl 0
gpu_full        | -ngl 99
